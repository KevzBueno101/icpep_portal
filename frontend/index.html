<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#001F4D" />
    <meta name="description" content="Membership portal for ICpEP Student Edition - Catanduanes State University Chapter" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Apple PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ICpEP Portal" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/icpep_logo.png" />
    <link rel="apple-touch-icon" href="/icpep_logo.png" />

    <title>ICpEP.SE Portal - CatSU Chapter</title>
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('icpep_theme')
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          if (theme === 'dark') document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
